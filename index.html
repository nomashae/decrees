<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Decrees & News | Nomashae</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phonescreenengine.css">
  <style>
    /* ═══════════════════════════════════════
       DESIGN TOKENS — same as index & culture
    ═══════════════════════════════════════ */
    :root {
      --accent: #4A7C59; --accent2: #2e5c3e;
      --bg: #f7f7f5; --bg2: #efefec; --card: #ffffff;
      --ink: #1a1a1a; --ink2: #555550;
      --border: rgba(0,0,0,0.08); --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --radius: 14px; --t: 0.3s ease;
    }
    [data-theme="dark"] {
      --bg: #141414; --bg2: #1e1e1e; --card: #242424;
      --ink: #f0f0ee; --ink2: #999992;
      --border: rgba(255,255,255,0.08); --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    [data-element="air"]   { --accent: #5B9BBF; }
    [data-element="water"] { --accent: #3A8F8F; }
    [data-element="fire"]  { --accent: #C4622D; }
    [data-element="earth"] { --accent: #4A7C59; }
    [data-theme="dark"][data-element="air"]   { --accent: #7bb8d8; }
    [data-theme="dark"][data-element="water"] { --accent: #5abfbf; }
    [data-theme="dark"][data-element="fire"]  { --accent: #e07a4a; }
    [data-theme="dark"][data-element="earth"] { --accent: #6aad82; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg); color: var(--ink);
      line-height: 1.7; transition: background var(--t), color var(--t);
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2.5rem; height: 64px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      transition: background var(--t), border-color var(--t);
    }
    .nav-left { display: flex; align-items: center; gap: 0.75rem; }
    .back-link {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none; color: var(--ink2);
      font-size: 0.78rem; font-weight: 500; letter-spacing: 1px;
      text-transform: uppercase; transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 16px; height: 16px; fill: currentColor; }
    .nav-brand {
      font-size: 1rem; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--accent); text-decoration: none;
      transition: color var(--t);
    }
    .nav-right { display: flex; gap: 0.5rem; align-items: center; }
    .nav-btn {
      background: transparent; border: 1.5px solid var(--border);
      color: var(--ink2); padding: 0.35rem 0.9rem; border-radius: 8px;
      cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 1px;
      text-transform: uppercase; transition: all 0.2s;
      text-decoration: none; display: inline-block;
    }
    .nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* HERO */
    .hero {
      padding: 5rem 2rem 4rem; text-align: center;
      border-bottom: 1px solid var(--border);
      transition: background var(--t), border-color var(--t);
    }
    .hero-label {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 4px;
      text-transform: uppercase; color: var(--accent); display: block;
      margin-bottom: 0.5rem; transition: color var(--t);
    }
    .hero-title {
      font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700;
      color: var(--ink); letter-spacing: 2px; margin-bottom: 0.5rem;
      transition: color var(--t);
    }
    .hero-sub {
      font-size: 0.9rem; color: var(--ink2); font-weight: 300;
      font-style: italic; transition: color var(--t);
    }

    .section { padding: 5rem 2rem; border-top: 1px solid var(--border); transition: border-color var(--t); }
    .section.alt { background: var(--bg2); transition: background var(--t), border-color var(--t); justify-content: center; align-items: center; text-align: center;}

    /* MAIN LAYOUT */
    .decrees-wrap {
      max-width: 800px; margin: 0 auto;
      padding: 4rem 2rem 5rem;
    }

    /* SEARCH */
    .search-bar {
      display: flex; align-items: center; gap: 0.7rem;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0.65rem 1.1rem; margin-bottom: 1.2rem;
      transition: border-color 0.2s, background var(--t);
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar i { color: var(--ink2); flex-shrink: 0; }
    .search-bar input {
      border: none; background: transparent; outline: none; flex: 1;
      font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--ink);
    }
    .search-bar input::placeholder { color: var(--ink2); }
    .search-clear {
      border: none; background: transparent; color: var(--ink2); cursor: pointer;
      font-size: 0.85rem; padding: 0.15rem; display: none;
    }
    .search-clear.show { display: block; }

    /* FILTER BAR */
    .cat-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .cat-filter-btn {
      padding: 0.35rem 0.9rem; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--bg2); color: var(--ink2); font-size: 0.68rem; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.18s;
    }
    .cat-filter-btn:hover, .cat-filter-btn.active { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 10%,transparent); color: var(--accent); }

    .result-count { font-size: 0.72rem; color: var(--ink2); margin: -1.2rem 0 1.6rem; }

    /* DECREE CARD */
    .decree {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      transition: background var(--t), border-color var(--t), transform 0.25s;
      opacity: 0; transform: translateY(20px);
      animation: fadeUp 0.5s ease forwards;
      scroll-margin-top: 90px;
    }
    .decree:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.1); }
    .decree:target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .decree-img { width: 100%; max-height: 340px; object-fit: cover; border-radius: 10px; margin-bottom: 1.2rem; display: block; }

    .decree-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; flex-wrap: wrap;
      padding-bottom: 1rem; margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      transition: border-color var(--t);
    }
    .decree-title {
      font-size: 1.05rem; font-weight: 700;
      color: var(--ink); line-height: 1.4;
      transition: color var(--t);
    }
    .decree-meta {
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem;
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.58rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; padding: 0.25rem 0.7rem;
      border-radius: 20px; display: inline-block;
    }
    .badge-active  { background: rgba(74,124,89,0.12);  color: #3a6b45; border: 1px solid rgba(74,124,89,0.25); }
    .badge-passed  { background: rgba(74,124,89,0.12);  color: #3a6b45; border: 1px solid rgba(74,124,89,0.25); }
    .badge-press   { background: rgba(90,155,191,0.12); color: #2e6e9e; border: 1px solid rgba(90,155,191,0.25); }
    .badge-order   { background: rgba(196,98,45,0.12);  color: #9e4420; border: 1px solid rgba(196,98,45,0.25); }
    .badge-decree  { background: rgba(160,120,60,0.12); color: #7a5a20; border: 1px solid rgba(160,120,60,0.25); }
    .badge-urgent  { background: rgba(196,68,68,0.12);  color: #c44;    border: 1px solid rgba(196,68,68,0.25); }
    [data-theme="dark"] .badge-active  { background: rgba(74,124,89,0.2);  color: #6aad82; }
    [data-theme="dark"] .badge-passed  { background: rgba(74,124,89,0.2);  color: #6aad82; }
    [data-theme="dark"] .badge-press   { background: rgba(90,155,191,0.2); color: #7bb8d8; }
    [data-theme="dark"] .badge-order   { background: rgba(196,98,45,0.2);  color: #e07a4a; }
    [data-theme="dark"] .badge-decree  { background: rgba(160,120,60,0.2); color: #c8a050; }
    [data-theme="dark"] .badge-urgent  { background: rgba(196,68,68,0.22); color: #e88; }

    .date-stamp {
      font-size: 0.65rem; color: var(--ink2); font-weight: 400;
      letter-spacing: 1px; transition: color var(--t);
    }
    .reading-time {
      font-size: 0.63rem; color: var(--ink2); display: flex; align-items: center; gap: 0.3rem;
    }

    .decree-body { font-size: 0.92rem; font-weight: 300; color: var(--ink2); line-height: 1.85; transition: color var(--t); }

    /* Content-area (collapsible) */
    .decree-content-inner { position: relative; overflow: hidden; transition: max-height 0.45s ease; }
    .decree-content-inner::after { content: ""; display: table; clear: both; }
    .decree-fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 74px;
      background: linear-gradient(to bottom, transparent, var(--card));
      pointer-events: none; opacity: 1; transition: opacity 0.3s;
    }
    .decree.expanded .decree-fade { opacity: 0; }
    .read-more-btn {
      display: inline-flex; align-items: center; gap: 0.45rem; margin-top: 1.2rem;
      background: none; border: 1.5px solid var(--accent); color: var(--accent);
      padding: 0.55rem 1.2rem; border-radius: 8px; font-family: 'Outfit', sans-serif;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .read-more-btn:hover { background: var(--accent); color: #fff; }
    .read-more-btn i { transition: transform 0.3s; font-size: 0.65rem; }
    .decree.expanded .read-more-btn i { transform: rotate(180deg); }

    /* Rich content blocks — rendered inside .decree-content-inner */
    .decree-body h1, .decree-body h2, .decree-body h3 {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent); margin: 1.2rem 0 0.5rem; transition: color var(--t);
    }
    .decree-body p { margin-bottom: 0.7rem; color: var(--ink); font-size: 0.92rem; font-weight: 300; }
    .decree-body ul, .decree-body ol { margin: 0.5rem 0 0.9rem 1.3rem; color: var(--ink); }
    .decree-body li { margin-bottom: 0.3rem; }
    .decree-body a { color: var(--accent); }
    .decree-body strong, .decree-body b { color: var(--ink); font-weight: 600; }
    .decree-body blockquote {
      border-left: 3px solid var(--accent); padding: 0.8rem 1.2rem;
      background: var(--bg2); border-radius: 0 8px 8px 0;
      margin: 1rem 0; font-style: italic; font-size: 0.9rem; color: var(--ink2);
    }
    .decree-body code { background: var(--bg2); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
    .decree-body hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    .decree-body .pullquote {
      font-size: 1.2rem; font-weight: 500; color: var(--ink); font-style: italic;
      text-align: center; margin: 1.8rem 0; padding: 1.1rem 0.5rem;
      border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    }

    .decree-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
    .decree-body table th, .decree-body table td { border: 1px solid var(--border); padding: 0.5rem 0.7rem; text-align: left; color: var(--ink); }
    .decree-body table th { background: var(--bg2); font-weight: 600; }

    .decree-body figure { margin: 0.4rem 0 1.1rem; }
    .decree-body figure img { width: 100%; border-radius: 10px; display: block; margin: 0; }
    .decree-body figcaption {
      font-size: 0.72rem; color: var(--ink2); text-align: center;
      margin-top: 0.5rem; font-style: italic; line-height: 1.4;
    }
    .decree-body figure.align-left  { float: left; max-width: 45%; margin: 0.3rem 1.4rem 1rem 0; }
    .decree-body figure.align-right { float: right; max-width: 45%; margin: 0.3rem 0 1rem 1.4rem; }
    .decree-body figure.align-center{ margin: 1.4rem auto; max-width: 100%; }
    .decree-body figure.align-wide  { width: 100%; margin: 1.4rem 0; }
    .decree-body img { max-width: 100%; border-radius: 8px; margin: 0.6rem 0; }

    .decree-sig {
      margin-top: 1.5rem; padding-top: 1rem;
      border-top: 1px solid var(--border);
      text-align: right; font-style: italic;
      font-size: 0.85rem; font-weight: 500;
      color: var(--accent); transition: color var(--t), border-color var(--t);
      clear: both;
    }
    .decree-sig .sig-date {
      display: block; font-size: 0.72rem; font-weight: 300;
      color: var(--ink2); font-style: normal; margin-bottom: 0.2rem;
      transition: color var(--t);
    }

    .news-empty {
      text-align: center; padding: 4rem 2rem; color: var(--ink2);
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .news-empty i { font-size: 2rem; margin-bottom: 1rem; display: block; opacity: 0.4; color: var(--accent); }
    .news-empty p { font-size: 0.88rem; font-weight: 300; }

    footer {
      border-top: 1px solid var(--border); text-align: center; padding: 2.5rem 1rem;
      font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase;
      color: var(--ink2); transition: border-color var(--t), color var(--t);
    }

    .btnbtn {
      display: block; width: fit-content; text-decoration: none;
      background: var(--accent); border: none; color: #fff;
      padding: 0.85rem; border-radius: 8px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; transition: opacity 0.2s;
      margin: 0 auto;
    }

    #topBtn {
      position: fixed; bottom: 30px; right: 30px; padding: 16px 16px;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
      cursor: pointer; background-color: var(--bg2); border: none;
      border-radius: 5px; text-align: center;
    }
    #topBtn.visible { opacity: 1; pointer-events: auto; }

    @media (max-width: 600px) {
      nav { padding: 0 1rem; }
      .decrees-wrap { padding: 2.5rem 1.2rem; }
      .decree-header { flex-direction: column; }
      .decree-meta { align-items: flex-start; }
      .decree-body figure.align-left,
      .decree-body figure.align-right { float: none; max-width: 100%; margin: 0.6rem 0 1rem; }
    }

    .decree_link { text-decoration: none; color: var(--accent); }
    .decree_link:hover { text-decoration: underline; }
  </style>
</head>
<body data-theme="light" data-element="earth">

  <nav>
    <div class="nav-left">
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back
      </a>
      <a href="index.html" class="nav-brand">Nomashae</a>
    </div>
    <div class="nav-right">
      <button class="nav-btn" id="dark-btn">Dark</button>
      <button class="nav-btn" id="lang-btn">EN</button>
    </div>
  </nav>

  <div class="hero">
    <span class="hero-label">Republic of Nomashae</span>
    <h1 class="hero-title">Decrees & News</h1>
    <p class="hero-sub">Official orders, press releases and announcements</p>
  </div>

  <div class="section alt">
    <span class="hero-label">Constitution</span>
    <h1 class="hero-title">Constitution of Nomashae</h1>
    <p class="hero-sub">The Constitution of Republic of Nomashae</p>
    <h1 class="hero-label">&nbsp;</h1>
    <div>
      <a href="./assets/constitution/Constitution.pdf" class="btnbtn">View Constitution</a>
    </div>
  </div>

  <div class="decrees-wrap">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search decrees and news…" autocomplete="off"/>
      <button class="search-clear" id="search-clear"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="cat-filters" id="cat-filters">
      <button class="cat-filter-btn active" data-cat="all">All</button>
      <button class="cat-filter-btn" data-cat="Announcement">Announcement</button>
      <button class="cat-filter-btn" data-cat="Decree">Decree</button>
      <button class="cat-filter-btn" data-cat="Event">Event</button>
      <button class="cat-filter-btn" data-cat="Urgent">Urgent</button>
      <button class="cat-filter-btn" data-cat="Historical Record">Historical Record</button>
    </div>

    <p class="result-count" id="result-count"></p>

    <div id="decree-list">
      <div class="news-empty">
        <i class="fa-solid fa-satellite-dish"></i>
        <p>Loading decrees from the Ministry…</p>
      </div>
    </div>
  </div>

  <footer id="footer"><p>© 2026 Nomashae · Powered by the Elements</p></footer>

  <button id="topBtn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"><i class="fa-solid fa-angles-up fa-xl" style="color: var(--ink);"></i></button>

  <!-- Markdown rendering + sanitization (legacy posts) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

  <!-- FIREBASE -->
  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(FIREBASE_CONFIG);
    const db  = getFirestore(app);

    const CAT_BADGE = {
      'Announcement': 'badge-press',
      'Decree': 'badge-decree',
      'Event': 'badge-active',
      'Urgent': 'badge-urgent',
      'Historical Record': 'badge-passed'
    };

    const COLLAPSE_HEIGHT = 280; // px — teaser height before "Read more"
    const SANITIZE_OPTS = { ADD_TAGS: ['figure','figcaption'], ADD_ATTR: ['class'] };

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function readingTime(plainText) {
      const words = plainText ? plainText.split(' ').filter(Boolean).length : 0;
      const mins = Math.max(1, Math.round(words / 200));
      return `${mins} min read`;
    }

    let _allPosts = [];

    function bodyHtmlFor(d) {
      // Prefer the new rich-text field; fall back to legacy Markdown field.
      if (d.bodyHtml) return window.DOMPurify.sanitize(d.bodyHtml, SANITIZE_OPTS);
      const md = d.bodyMarkdown || d.body || '';
      return window.DOMPurify.sanitize(window.marked.parse(md), SANITIZE_OPTS);
    }

    function renderDecree(id, d) {
      const badgeClass = CAT_BADGE[d.category] || 'badge-press';
      const dt = d.createdAt?.toDate ? d.createdAt.toDate() : null;
      const date = dt ? dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) + ' · ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : 'Recent';
      const html = bodyHtmlFor(d);
      const plain = stripHtml(html);
      const img = d.imageUrl ? `<img class="decree-img" src="${d.imageUrl}" alt="">` : '';
      return `<div class="decree" id="post-${id}" data-cat="${escapeHtml(d.category||'Announcement')}">
        <div class="decree-header">
          <div class="decree-title">${escapeHtml(d.title)}</div>
          <div class="decree-meta">
            <span class="badge ${badgeClass}">${escapeHtml(d.category||'Announcement')}</span>
            <span class="date-stamp">${date}</span>
            <span class="reading-time"><i class="fa-regular fa-clock"></i>${readingTime(plain)}</span>
          </div>
        </div>
        <div class="decree-body">
          ${img}
          <div class="decree-content-inner collapsed" style="max-height:${COLLAPSE_HEIGHT}px">
            ${html}
            <div class="decree-sig">
              <span class="sig-date">Posted ${date}</span>
              ${escapeHtml(d.author || 'Ministry of Nomashae')}
            </div>
          </div>
          <div class="decree-fade"></div>
          <button class="read-more-btn" type="button">
            <span class="rm-label">Read Full ${escapeHtml(d.category || 'Post')}</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>
      </div>`;
    }

    function wireUpCollapsibles(root) {
      root.querySelectorAll('.decree').forEach(card => {
        const inner = card.querySelector('.decree-content-inner');
        const btn = card.querySelector('.read-more-btn');
        const label = btn.querySelector('.rm-label');
        const catWord = card.dataset.cat || 'Post';

        // If content already fits within the teaser height, no need for the control.
        if (inner.scrollHeight <= COLLAPSE_HEIGHT + 8) {
          inner.classList.remove('collapsed');
          inner.style.maxHeight = 'none';
          btn.style.display = 'none';
          card.querySelector('.decree-fade').style.display = 'none';
          return;
        }

        btn.addEventListener('click', () => {
          const expanded = card.classList.toggle('expanded');
          if (expanded) {
            inner.style.maxHeight = inner.scrollHeight + 'px';
            inner.classList.remove('collapsed');
            label.textContent = 'Show Less';
          } else {
            inner.style.maxHeight = COLLAPSE_HEIGHT + 'px';
            inner.classList.add('collapsed');
            label.textContent = `Read Full ${catWord}`;
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
    }

    function currentFilters() {
      const activeBtn = document.querySelector('.cat-filter-btn.active');
      const cat = activeBtn ? activeBtn.dataset.cat : 'all';
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      return { cat, q };
    }

    function renderList() {
      const { cat, q } = currentFilters();
      const list = document.getElementById('decree-list');
      let posts = cat === 'all' ? _allPosts : _allPosts.filter(p => (p.data.category || 'Announcement') === cat);
      if (q) {
        posts = posts.filter(p => {
          const hay = (p.data.title || '') + ' ' + stripHtml(bodyHtmlFor(p.data));
          return hay.toLowerCase().includes(q);
        });
      }
      document.getElementById('result-count').textContent = q || cat !== 'all'
        ? `${posts.length} result${posts.length===1?'':'s'} found`
        : '';
      if (!posts.length) {
        list.innerHTML = `<div class="news-empty"><i class="fa-solid fa-satellite-dish"></i><p>No posts match your search.</p></div>`;
        return;
      }
      list.innerHTML = posts.map(p => renderDecree(p.id, p.data)).join('');
      wireUpCollapsibles(list);
    }

    async function loadDecrees() {
      const list = document.getElementById('decree-list');
      try {
        const snap = await getDocs(query(collection(db,'news'), orderBy('createdAt','desc')));
        _allPosts = [];
        snap.forEach(doc => _allPosts.push({ id: doc.id, data: doc.data() }));
        if (!_allPosts.length) {
          list.innerHTML = `<div class="news-empty"><i class="fa-solid fa-satellite-dish"></i><p>No news posted yet. Check back soon.</p></div>`;
          return;
        }
        renderList();
        // scroll to (and expand) a specific post if linked via hash
        if (location.hash) {
          const target = document.querySelector(location.hash);
          if (target) {
            const inner = target.querySelector('.decree-content-inner');
            const btn = target.querySelector('.read-more-btn');
            if (inner && btn && btn.style.display !== 'none') {
              target.classList.add('expanded');
              inner.classList.remove('collapsed');
              inner.style.maxHeight = inner.scrollHeight + 'px';
              btn.querySelector('.rm-label').textContent = 'Show Less';
            }
            setTimeout(() => target.scrollIntoView({behavior:'smooth', block:'start'}), 200);
          }
        }
      } catch(e) {
        list.innerHTML = `<div class="news-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load decrees. Check your Firebase config.</p></div>`;
        console.error(e);
      }
    }

    document.getElementById('cat-filters').addEventListener('click', e => {
      const btn = e.target.closest('.cat-filter-btn');
      if (!btn) return;
      document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    });

    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    let searchDebounce;
    searchInput.addEventListener('input', () => {
      searchClear.classList.toggle('show', !!searchInput.value);
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(renderList, 150);
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.remove('show');
      renderList();
      searchInput.focus();
    });

    loadDecrees();
  </script>

  <script>
    // Element by time
    function getElement() {
      const h = new Date().getHours();
      if (h >= 6  && h < 12) return 'air';
      if (h >= 12 && h < 18) return 'water';
      if (h >= 18 && h < 22) return 'fire';
      return 'earth';
    }
    document.body.setAttribute('data-element', getElement());

    // Dark mode — persisted
    const darkBtn = document.getElementById('dark-btn');
    let isDark = false;
    try { isDark = localStorage.getItem('nmDark') === 'true'; } catch(e) {}
    function applyDark() {
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      darkBtn.classList.toggle('active', isDark);
      darkBtn.textContent = isDark ? 'Light' : 'Dark';
    }
    darkBtn.addEventListener('click', () => {
      isDark = !isDark;
      try { localStorage.setItem('nmDark', isDark); } catch(e) {}
      applyDark();
    });
    applyDark();
  </script>

  <script src="./translations.js"></script>

  <script>
    const topBtn = document.getElementById('topBtn');
    window.addEventListener('scroll', () => {
      topBtn.classList.toggle('visible', window.scrollY > 400);
    });
  </script>
</body>
</html>
